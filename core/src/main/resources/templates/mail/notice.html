<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
  <meta charset="UTF-8">
  <title th:text="${title}">Orthiva</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Segoe UI,Arial,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">
          <tr>
            <td style="padding:20px 28px;background:#0f766e;color:#ffffff;font-size:18px;font-weight:600;">
              Orthiva <span style="font-weight:400;opacity:.85;" th:text="'· ' + ${labName}"></span>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <h1 style="margin:0 0 12px;font-size:20px;" th:text="${title}">Title</h1>
              <p style="margin:0 0 20px;font-size:15px;line-height:1.5;" th:utext="${body}">Body</p>
              <a th:href="${link}" style="display:inline-block;padding:10px 18px;background:#0f766e;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:600;" th:text="${cta}">Open</a>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px;background:#f9fafb;color:#6b7280;font-size:12px;" th:text="${footer}">Footer</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
