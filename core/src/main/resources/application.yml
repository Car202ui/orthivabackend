spring:
  application:
    name: orthiva-core

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:orthiva}
    username: ${DB_USER:orthiva_app}
    password: ${DB_PASSWORD:orthiva_app_dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate.default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Dev: Mailpit (docker-compose), UI at http://localhost:8025. Production: real SMTP through env vars.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  thymeleaf:
    check-template-location: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/orthiva}
          audiences: orthiva-core

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      show-details: when-authorized

orthiva:
  # Phase 1: every self-registered user joins this laboratory. Multi-lab onboarding comes later.
  default-tenant-slug: ${DEFAULT_TENANT_SLUG:orthiva-dev}
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:orthiva}
    client-id: ${KEYCLOAK_CLIENT_ID:orthiva-core}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:orthiva-core-dev-secret}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  # Public URL of the web app (mock checkout page, links in e-mails).
  app-url: ${APP_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:Orthiva <no-reply@orthiva.local>}
  payments:
    # Dev only: enables the MOCK gateway (local pay page) and POST /api/payments/{id}/mock-approve. Never true in production.
    mock-enabled: ${PAYMENTS_MOCK_ENABLED:true}
    # Wompi (Colombia). The gateway is used automatically when the three secrets are present; test keys (pub_test_/prv_test_) hit the sandbox.
    wompi:
      public-key: ${WOMPI_PUBLIC_KEY:}
      integrity-secret: ${WOMPI_INTEGRITY_SECRET:}
      events-secret: ${WOMPI_EVENTS_SECRET:}
      checkout-url: ${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/p/}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:orthiva}
    secret-key: ${S3_SECRET_KEY:orthiva_dev_minio}
    bucket: ${S3_BUCKET:orthiva-media}
    presign-minutes: 15
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
