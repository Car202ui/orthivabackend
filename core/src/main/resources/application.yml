spring:
  application:
    name: orthiva-core

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:orthiva}
    username: ${DB_USER:orthiva_app}
    password: ${DB_PASSWORD:orthiva_app_dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate.default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/orthiva}
          audiences: orthiva-core

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      show-details: when-authorized

orthiva:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:orthiva}
    secret-key: ${S3_SECRET_KEY:orthiva_dev_minio}
    bucket: ${S3_BUCKET:orthiva-media}
    presign-minutes: 15
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
