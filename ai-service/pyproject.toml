[project]
name = "orthiva-ai-service"
version = "0.1.0"
description = "Orthiva AI service: vision on dental photos, RAG assistant, 3D mesh (STL) processing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Heavy ML / 3D deps — installed later, when the vision and mesh modules are built.
ml = [
    "torch",
    "numpy",
    "pillow",
    "trimesh",
    "open3d",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"
